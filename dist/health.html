<!DOCTYPE html>
<html>
<head>
    <title>Frontend Health Check</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 50px;
            background-color: #f0f0f0;
        }
        .status {
            padding: 20px;
            border-radius: 10px;
            margin: 20px;
        }
        .success {
            background-color: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        .error {
            background-color: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
    </style>
</head>
<body>
    <h1>Mastersolis Frontend</h1>
    <div class="status success">
        <h2>✅ Frontend is Running</h2>
        <p>Application is healthy and ready to serve requests</p>
    </div>
</body>
</html>
